name: Database update
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/tests/**', 'scripts/db/**', '.github/workflows/db-migrate.yml']
  workflow_dispatch: {}
concurrency: { group: db-migrate, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the database rules tests
        env: { PGHOST: localhost, PGPORT: '5432', PGPASSWORD: postgres }
        run: |
          bash supabase/tests/run.sh | tee result.txt
          grep -Eq '^ +[0-9]+ \| +0$' result.txt || { echo "::error::Database tests failed, nothing was changed in the live database"; grep FAIL result.txt; exit 1; }
  apply:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply new migrations to the live database
        env: { SUPABASE_DB_URL: '${{ secrets.SUPABASE_DB_URL }}' }
        run: bash scripts/db/migrate.sh
