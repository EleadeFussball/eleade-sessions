name: Nightly backup
on:
  schedule:
    - cron: '30 15 * * *'   # 02:30 Sydney (AEDT) / 01:30 (AEST)
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --prefix scripts/backup exceljs
      - run: node scripts/backup/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bmrkhzaqbypxxuckgoqo.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eleade-backup-${{ github.run_number }}
          path: eleade-backup.xlsx
          retention-days: 90
